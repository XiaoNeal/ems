<?xml version="1.0" encoding="UTF-8"?>
<svg id="_图层_2" data-name="图层 2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 23.82 23.82">
  <defs>
    <style>
      .cls-1 {
        fill: #4e5969;
      }

      .cls-2 {
        fill: none;
        stroke: #4e5969;
        stroke-linecap: round;
        stroke-miterlimit: 10;
        stroke-width: 1.5px;
      }
    </style>
  </defs>
  <!-- 画布补成正方形：原 viewBox 是 15.32 x 23.82（竖长），而页面里 <image> 统一写死
       40rpx x 40rpx 正方形，uni-app 默认 mode="scaleToFill" 会把电池横向拉伸变形。
       把原图形整体右移 (23.82 - 15.32) / 2 = 4.25 居中后，等比缩放到正方形即不变形。 -->
  <g transform="translate(4.25, 0)">
    <g id="_图层_1-2" data-name="图层 1">
      <rect class="cls-2" x=".75" y="3.94" width="13.82" height="19.13" rx="1.16" ry="1.16"/>
      <line class="cls-2" x1="5.42" y1=".75" x2="9.9" y2=".75"/>
      <polygon class="cls-1" points="2.95 7.05 2.95 19.97 12.04 19.97 12.04 10.78 2.95 7.05"/>
    </g>
  </g>
</svg>
